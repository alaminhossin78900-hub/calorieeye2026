<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CalorieEye - AI Calorie Analyzer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: #0a0a0f; font-family: 'Segoe UI', sans-serif; color: #f9fafb; padding: 20px; }
  .container { max-width: 600px; margin: 0 auto; padding: 40px 20px; }
  .header { text-align: center; margin-bottom: 40px; }
  .badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.2); border-radius: 99px; padding: 6px 16px; margin-bottom: 20px; font-size: 12px; color: #34d399; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
  h1 { font-size: 52px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.03em; }
  h1 span { color: #34d399; }
  .subtitle { font-size: 16px; color: #6b7280; line-height: 1.6; }
  .upload-zone { border: 2px dashed rgba(255,255,255,0.1); border-radius: 24px; background: rgba(255,255,255,0.02); min-height: 200px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; margin-bottom: 16px; overflow: hidden; position: relative; }
  .upload-zone:hover { border-color: rgba(52,211,153,0.4); }
  .upload-zone.drag { border-color: #34d399; background: rgba(52,211,153,0.05); }
  .upload-text { text-align: center; padding: 40px; }
  .upload-text .emoji { font-size: 48px; margin-bottom: 16px; }
  .upload-text p { color: #6b7280; font-size: 15px; }
  .preview-img { width: 100%; max-height: 350px; object-fit: cover; border-radius: 22px; display: block; }
  .remove-btn { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6); border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
  .api-input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #f9fafb; font-size: 14px; margin-bottom: 12px; outline: none; font-family: monospace; }
  .api-input:focus { border-color: rgba(52,211,153,0.4); }
  .analyze-btn { width: 100%; padding: 18px; border-radius: 16px; border: none; background: linear-gradient(135deg, #34d399, #059669); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 20px; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .analyze-btn:disabled { background: rgba(52,211,153,0.3); cursor: not-allowed; }
  .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); border-radius: 14px; padding: 16px; color: #fca5a5; text-align: center; margin-bottom: 16px; font-size: 14px; }
  .result { animation: fadeUp 0.6s ease forwards; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 24px; margin-bottom: 14px; }
  .food-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .food-name { font-size: 24px; font-weight: 800; margin: 6px 0 4px; }
  .serving { color: #6b7280; font-size: 13px; }
  .calorie-card { background: linear-gradient(135deg, rgba(52,211,153,0.12), rgba(5,150,105,0.06)); border: 1px solid rgba(52,211,153,0.2); border-radius: 24px; padding: 28px; text-align: center; margin-bottom: 14px; }
  .calorie-label { font-size: 12px; color: #34d399; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; margin-bottom: 8px; }
  .calorie-number { font-size: 68px; font-weight: 800; line-height: 1; }
  .calorie-unit { color: #6b7280; font-size: 14px; margin-top: 6px; }
  .macro-label { display: flex; justify-content: space-between; margin-bottom: 5px; }
  .macro-label span:first-child { font-size: 12px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.08em; }
  .macro-label span:last-child { font-size: 13px; font-weight: 700; }
  .bar-bg { height: 6px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .bar-fill { height: 100%; border-radius: 99px; transition: width 1s cubic-bezier(0.34,1.56,0.64,1); }
  .section-title { font-size: 13px; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 16px; }
  .vitamin-tag { display: inline-block; background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.2); border-radius: 99px; padding: 4px 12px; font-size: 12px; color: #34d399; font-weight: 600; margin: 4px; }
  .tip-card { background: rgba(251,146,60,0.06); border: 1px solid rgba(251,146,60,0.15); border-radius: 24px; padding: 24px; margin-bottom: 14px; }
  .tip-title { font-size: 13px; font-weight: 700; color: #fb923c; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
  .tip-text { font-size: 13px; color: #d1d5db; line-height: 1.6; }
  .reset-btn { width: 100%; padding: 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: #9ca3af; font-size: 14px; font-weight: 600; cursor: pointer; }
  .bg-blob1 { position: fixed; top: -15%; left: -10%; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(52,211,153,0.1) 0%, transparent 70%); pointer-events: none; z-index: 0; }
  .bg-blob2 { position: fixed; bottom: -10%; right: -10%; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(251,146,60,0.08) 0%, transparent 70%); pointer-events: none; z-index: 0; }
  .content { position: relative; z-index: 1; }
</style>
</head>
<body>
<div class="bg-blob1"></div>
<div class="bg-blob2"></div>
<div class="container content">
  <div class="header">
    <div class="badge">👁️ AI Nutrition Analyzer</div>
    <h1>Calorie<span>Eye</span></h1>
    <p class="subtitle">Upload any food photo — AI instantly reveals calories & nutrition facts</p>
  </div>

  <input type="text" class="api-input" id="apiKey" placeholder="🔑 Enter your Gemini API Key: AIzaSy-..." />

  <div class="upload-zone" id="uploadZone">
    <div class="upload-text">
      <div class="emoji">🍽️</div>
      <p>Drop your food photo here or click to browse</p>
    </div>
  </div>
  <input type="file" id="fileInput" accept="image/*" style="display:none">

  <button class="analyze-btn" id="analyzeBtn" style="display:none">
    👁️ Analyze with CalorieEye
  </button>

  <div id="error" style="display:none" class="error"></div>
  <div id="result" style="display:none" class="result"></div>
</div>

<script>
  let imageBase64 = null;
  let imageMime = null;

  const uploadZone = document.getElementById('uploadZone');
  const fileInput = document.getElementById('fileInput');
  const analyzeBtn = document.getElementById('analyzeBtn');
  const errorDiv = document.getElementById('error');
  const resultDiv = document.getElementById('result');

  uploadZone.addEventListener('click', () => { if (!imageBase64) fileInput.click(); });
  uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('drag'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
  uploadZone.addEventListener('drop', (e) => { e.preventDefault(); uploadZone.classList.remove('drag'); handleFile(e.dataTransfer.files[0]); });
  fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

  function handleFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    imageMime = file.type;
    const reader = new FileReader();
    reader.onload = (e) => {
      imageBase64 = e.target.result.split(',')[1];
      uploadZone.innerHTML = `<img src="${e.target.result}" class="preview-img"><button class="remove-btn" onclick="resetImage(event)">×</button>`;
      analyzeBtn.style.display = 'flex';
      resultDiv.style.display = 'none';
      errorDiv.style.display = 'none';
    };
    reader.readAsDataURL(file);
  }

  function resetImage(e) {
    e && e.stopPropagation();
    imageBase64 = null; imageMime = null;
    uploadZone.innerHTML = `<div class="upload-text"><div class="emoji">🍽️</div><p>Drop your food photo here or click to browse</p></div>`;
    analyzeBtn.style.display = 'none';
    resultDiv.style.display = 'none';
    errorDiv.style.display = 'none';
    fileInput.value = '';
  }

  analyzeBtn.addEventListener('click', async () => {
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey) { showError('⚠️ Please enter your Gemini API Key first!'); return; }
    if (!imageBase64) { showError('⚠️ Please upload a food photo first!'); return; }

    analyzeBtn.disabled = true;
    analyzeBtn.innerHTML = '<div class="spinner"></div> Analyzing your food…';
    errorDiv.style.display = 'none';
    resultDiv.style.display = 'none';

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { inline_data: { mime_type: imageMime, data: imageBase64 } },
              { text: `Analyze this food image and respond ONLY with a JSON object (no markdown, no backticks):
{
  "foodName": "food name",
  "emoji": "one emoji",
  "calories": number,
  "servingSize": "estimated serving",
  "macros": { "protein": number, "carbs": number, "fat": number, "fiber": number },
  "vitamins": ["vitamin1", "vitamin2"],
  "healthScore": number 1-10,
  "healthLabel": "Excellent/Good/Fair/Indulgent",
  "tip": "short nutrition tip",
  "isFood": true or false
}` }
            ]
          }]
        })
      });

      const data = await response.json();
      if (data.error) { showError('❌ ' + data.error.message); return; }
      const text = data.candidates[0].content.parts[0].text;
      const parsed = JSON.parse(text.replace(/```json|```/g, '').trim());
      if (!parsed.isFood) { showError('❌ No food detected! Please upload a food photo.'); return; }
      showResult(parsed);
    } catch(e) {
      showError('❌ Something went wrong. Please try again.');
    }

    analyzeBtn.disabled = false;
    analyzeBtn.innerHTML = '👁️ Analyze with CalorieEye';
  });

  function showError(msg) {
    errorDiv.textContent = msg;
    errorDiv.style.display = 'block';
  }

  function macroBar(label, value, max, color) {
    const pct = Math.min((value/max)*100, 100);
    return `<div class="macro-label"><span>${label}</span><span>${value}g</span></div><div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>`;
  }

  function showResult(d) {
    const color = d.healthScore >= 8 ? '#4ade80' : d.healthScore >= 5 ? '#facc15' : '#f87171';
    const r = 36, circ = 2*Math.PI*r;
    const offset = circ * (1 - d.healthScore/10);
    resultDiv.innerHTML = `
      <div class="card">
        <div class="food-header">
          <div>
            <div style="font-size:32px">${d.emoji}</div>
            <div class="food-name">${d.foodName}</div>
            <div class="serving">${d.servingSize}</div>
          </div>
          <div style="text-align:center">
            <svg width="80" height="80" viewBox="0 0 90 90">
              <circle cx="45" cy="45" r="${r}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="7"/>
              <circle cx="45" cy="45" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round" transform="rotate(-90 45 45)"/>
              <text x="45" y="50" text-anchor="middle" fill="${color}" font-size="18" font-weight="800">${d.healthScore}</text>
            </svg>
            <div style="font-size:11px;color:${color};font-weight:700;text-transform:uppercase">${d.healthLabel}</div>
          </div>
        </div>
      </div>
      <div class="calorie-card">
        <div class="calorie-label">Total Calories</div>
        <div class="calorie-number">${d.calories}</div>
        <div class="calorie-unit">kcal</div>
      </div>
      <div class="card">
        <div class="section-title">Macronutrients</div>
        ${macroBar('Protein', d.macros.protein, 60, 'linear-gradient(90deg,#60a5fa,#3b82f6)')}
        ${macroBar('Carbs', d.macros.carbs, 150, 'linear-gradient(90deg,#fbbf24,#f59e0b)')}
        ${macroBar('Fat', d.macros.fat, 80, 'linear-gradient(90deg,#f87171,#ef4444)')}
        ${macroBar('Fiber', d.macros.fiber, 40, 'linear-gradient(90deg,#34d399,#059669)')}
      </div>
      <div class="card">
        <div class="section-title">Key Vitamins</div>
        ${d.vitamins.map(v => `<span class="vitamin-tag">${v}</span>`).join('')}
      </div>
      <div class="tip-card">
        <div class="tip-title">💡 Fun Nutrition Fact</div>
        <div class="tip-text">${d.tip}</div>
      </div>
      <button class="reset-btn" onclick="resetImage()">Analyze Another Food →</button>
    `;
    resultDiv.style.display = 'block';
  }
</script>
</body>
</html>
```
