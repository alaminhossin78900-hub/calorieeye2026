<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizMind AI - Smart Quiz Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: #0a0a0f; font-family: 'Segoe UI', sans-serif; color: #f9fafb; }
  .bg1 { position: fixed; top: -15%; left: -10%; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(139,92,246,0.12) 0%, transparent 70%); pointer-events: none; z-index: 0; }
  .bg2 { position: fixed; bottom: -10%; right: -10%; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(59,130,246,0.1) 0%, transparent 70%); pointer-events: none; z-index: 0; }
  .wrap { position: relative; z-index: 1; max-width: 700px; margin: 0 auto; padding: 40px 20px 80px; }
  .badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(139,92,246,0.1); border: 1px solid rgba(139,92,246,0.2); border-radius: 99px; padding: 6px 16px; margin-bottom: 20px; font-size: 12px; color: #a78bfa; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
  h1 { font-size: clamp(36px,8vw,60px); font-weight: 800; margin-bottom: 12px; letter-spacing: -0.03em; }
  h1 span { color: #a78bfa; }
  .subtitle { font-size: 16px; color: #6b7280; line-height: 1.6; margin-bottom: 40px; }
  .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 28px; margin-bottom: 16px; }
  .card-title { font-size: 13px; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: #6b7280; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .tab.active { background: rgba(139,92,246,0.15); border-color: rgba(139,92,246,0.4); color: #a78bfa; }
  .input-section { display: none; }
  .input-section.show { display: block; }
  textarea { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #f9fafb; font-size: 14px; outline: none; resize: vertical; min-height: 150px; font-family: 'Segoe UI', sans-serif; line-height: 1.6; }
  textarea:focus { border-color: rgba(139,92,246,0.4); }
  .upload-zone { border: 2px dashed rgba(255,255,255,0.1); border-radius: 16px; min-height: 150px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; overflow: hidden; position: relative; }
  .upload-zone:hover { border-color: rgba(139,92,246,0.4); }
  .upload-text { text-align: center; padding: 30px; }
  .upload-text .emoji { font-size: 40px; margin-bottom: 12px; }
  .upload-text p { color: #6b7280; font-size: 14px; }
  .preview-img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 14px; display: block; }
  .remove-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); border: none; color: #fff; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 16px; }
  input[type=text] { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #f9fafb; font-size: 14px; outline: none; margin-bottom: 12px; }
  input[type=text]:focus { border-color: rgba(139,92,246,0.4); }
  .gen-btn { width: 100%; padding: 18px; border-radius: 16px; border: none; background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; }
  .gen-btn:disabled { background: rgba(139,92,246,0.3); cursor: not-allowed; }
  .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); border-radius: 14px; padding: 16px; color: #fca5a5; text-align: center; margin-bottom: 16px; font-size: 14px; }
  .quiz-section { display: none; animation: fadeUp 0.6s ease forwards; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .quiz-title { font-size: 20px; font-weight: 800; }
  .timer-box { background: rgba(139,92,246,0.1); border: 1px solid rgba(139,92,246,0.2); border-radius: 12px; padding: 8px 16px; font-size: 18px; font-weight: 800; color: #a78bfa; }
  .timer-box.warning { background: rgba(248,113,113,0.1); border-color: rgba(248,113,113,0.3); color: #fca5a5; }
  .progress-bar { height: 4px; background: rgba(255,255,255,0.08); border-radius: 99px; margin-bottom: 24px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #8b5cf6, #6d28d9); border-radius: 99px; transition: width 0.3s; }
  .question-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 24px; margin-bottom: 16px; }
  .q-number { font-size: 12px; color: #a78bfa; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
  .q-text { font-size: 17px; font-weight: 600; margin-bottom: 20px; line-height: 1.5; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option { padding: 14px 18px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.02); cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; text-align: left; color: #f9fafb; }
  .option:hover:not(:disabled) { border-color: rgba(139,92,246,0.4); background: rgba(139,92,246,0.08); }
  .option.selected { border-color: rgba(139,92,246,0.6); background: rgba(139,92,246,0.15); color: #a78bfa; }
  .option.correct { border-color: rgba(74,222,128,0.6); background: rgba(74,222,128,0.12); color: #4ade80; }
  .option.wrong { border-color: rgba(248,113,113,0.6); background: rgba(248,113,113,0.12); color: #f87171; }
  .nav-btns { display: flex; gap: 12px; margin-top: 20px; }
  .nav-btn { flex: 1; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: #9ca3af; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .nav-btn.primary { background: linear-gradient(135deg, #8b5cf6, #6d28d9); border: none; color: #fff; }
  .score-section { display: none; text-align: center; animation: fadeUp 0.6s ease forwards; }
  .score-circle { width: 160px; height: 160px; margin: 0 auto 24px; }
  .score-num { font-size: 48px; font-weight: 800; margin-bottom: 8px; }
  .score-label { font-size: 16px; color: #6b7280; margin-bottom: 32px; }
  .score-details { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 24px; }
  .score-stat { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 16px; }
  .score-stat-num { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
  .score-stat-label { font-size: 12px; color: #6b7280; }
  .action-btns { display: flex; gap: 12px; flex-wrap: wrap; }
  .action-btn { flex: 1; min-width: 140px; padding: 14px; border-radius: 12px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
  .action-btn.purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff; }
  .action-btn.outline { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #9ca3af; }
</style>
</head>
<body>
<div class="bg1"></div>
<div class="bg2"></div>
<div class="wrap">
  <div style="text-align:center; margin-bottom:40px;">
    <div class="badge">🧠 AI Powered</div>
    <h1>Quiz<span>Mind</span> AI</h1>
    <p class="subtitle">Upload a book page or type any topic — AI generates 10 smart MCQs instantly!</p>
  </div>

  <div class="card">
    <div class="card-title">Step 1 — Enter Your Gemini API Key</div>
    <input type="text" id="apiKey" placeholder="🔑 AIzaSy-..." />
  </div>

  <div class="card">
    <div class="card-title">Step 2 — Choose Input Method</div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('text')">📝 Type Topic / Paste Text</button>
      <button class="tab" onclick="switchTab('image')">📸 Upload Book Page</button>
    </div>

    <div class="input-section show" id="textSection">
      <textarea id="topicText" placeholder="Type a topic (e.g. Photosynthesis, World War 2, Python programming) OR paste any text from your book..."></textarea>
    </div>

    <div class="input-section" id="imageSection">
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-text">
          <div class="emoji">📖</div>
          <p>Tap to upload book page photo</p>
        </div>
      </div>
      <input type="file" id="fileInput" accept="image/*" style="display:none">
    </div>
  </div>

  <button class="gen-btn" id="genBtn" onclick="generateQuiz()">🧠 Generate 10 MCQs</button>
  <div id="errorDiv" style="display:none" class="error"></div>

  <!-- Quiz Section -->
  <div class="quiz-section" id="quizSection">
    <div class="quiz-header">
      <div class="quiz-title">📝 Quiz Time!</div>
      <div class="timer-box" id="timerBox">⏱ 10:00</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div id="questionsDiv"></div>
    <div class="nav-btns">
      <button class="nav-btn outline" onclick="resetQuiz()">← Start Over</button>
      <button class="nav-btn primary" onclick="submitQuiz()">Submit Quiz ✓</button>
    </div>
  </div>

  <!-- Score Section -->
  <div class="score-section" id="scoreSection">
    <div class="card" style="text-align:center; padding:40px;">
      <div style="font-size:64px; margin-bottom:16px;" id="scoreEmoji">🎉</div>
      <div class="score-num" id="scoreNum">0/10</div>
      <div class="score-label" id="scoreLabel">Great job!</div>
      <div class="score-details">
        <div class="score-stat">
          <div class="score-stat-num" id="correctNum" style="color:#4ade80">0</div>
          <div class="score-stat-label">Correct</div>
        </div>
        <div class="score-stat">
          <div class="score-stat-num" id="wrongNum" style="color:#f87171">0</div>
          <div class="score-stat-label">Wrong</div>
        </div>
        <div class="score-stat">
          <div class="score-stat-num" id="pctNum" style="color:#a78bfa">0%</div>
          <div class="score-stat-label">Score</div>
        </div>
      </div>
      <div class="action-btns">
        <button class="action-btn purple" onclick="resetQuiz()">🔄 New Quiz</button>
        <button class="action-btn outline" onclick="downloadPDF()">📄 Download PDF</button>
      </div>
    </div>
    <div id="reviewDiv"></div>
  </div>
</div>

<script>
  let questions = [], userAnswers = [], imageBase64 = null, imageMime = null;
  let timerInterval = null, timeLeft = 600, activeTab = 'text';

  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (tab==='text'&&i===0)||(tab==='image'&&i===1)));
    document.getElementById('textSection').classList.toggle('show', tab==='text');
    document.getElementById('imageSection').classList.toggle('show', tab==='image');
  }

  document.getElementById('fileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    imageMime = file.type;
    const reader = new FileReader();
    reader.onload = (ev) => {
      imageBase64 = ev.target.result.split(',')[1];
      document.getElementById('uploadZone').innerHTML = `<img src="${ev.target.result}" class="preview-img"><button class="remove-btn" onclick="removeImg(event)">×</button>`;
    };
    reader.readAsDataURL(file);
  });

  function removeImg(e) {
    e.stopPropagation();
    imageBase64 = null; imageMime = null;
    document.getElementById('uploadZone').innerHTML = `<div class="upload-text"><div class="emoji">📖</div><p>Tap to upload book page photo</p></div>`;
    document.getElementById('fileInput').value = '';
  }

  async function generateQuiz() {
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey) { showError('⚠️ Please enter your Gemini API Key!'); return; }

    const btn = document.getElementById('genBtn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> Generating quiz…';
    document.getElementById('errorDiv').style.display = 'none';

    try {
      let parts = [];
      if (activeTab === 'image') {
        if (!imageBase64) { showError('⚠️ Please upload a book page image!'); btn.disabled=false; btn.innerHTML='🧠 Generate 10 MCQs'; return; }
        parts.push({ inline_data: { mime_type: imageMime, data: imageBase64 } });
      }
      const topicText = document.getElementById('topicText').value.trim();
      const prompt = activeTab === 'image'
        ? `Read this book page image and generate exactly 10 MCQ questions from its content. Respond ONLY with a JSON array (no markdown, no backticks): [{"question":"...","options":["A)...","B)...","C)...","D)..."],"answer":"A","explanation":"..."}]`
        : `Generate exactly 10 MCQ questions about: "${topicText || 'General Knowledge'}". Respond ONLY with a JSON array (no markdown, no backticks): [{"question":"...","options":["A)...","B)...","C)...","D)..."],"answer":"A","explanation":"..."}]`;
      parts.push({ text: prompt });

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts }] })
      });

      const data = await response.json();
      if (data.error) { showError('❌ ' + data.error.message); return; }
      const text = data.candidates[0].content.parts[0].text;
      questions = JSON.parse(text.replace(/```json|```/g, '').trim());
      userAnswers = new Array(questions.length).fill(null);
      startQuiz();
    } catch(e) {
      showError('❌ Something went wrong. Please try again.');
    }
    btn.disabled = false;
    btn.innerHTML = '🧠 Generate 10 MCQs';
  }

  function startQuiz() {
    document.getElementById('quizSection').style.display = 'block';
    document.getElementById('scoreSection').style.display = 'none';
    document.getElementById('quizSection').scrollIntoView({ behavior: 'smooth' });
    renderQuestions();
    startTimer();
  }

  function renderQuestions() {
    const div = document.getElementById('questionsDiv');
    div.innerHTML = questions.map((q, qi) => `
      <div class="question-card" id="qcard${qi}">
        <div class="q-number">Question ${qi+1} of ${questions.length}</div>
        <div class="q-text">${q.question}</div>
        <div class="options">
          ${q.options.map((opt, oi) => `
            <button class="option" id="opt${qi}_${oi}" onclick="selectAnswer(${qi}, ${oi}, '${['A','B','C','D'][oi]}')">${opt}</button>
          `).join('')}
        </div>
      </div>
    `).join('');
    updateProgress();
  }

  function selectAnswer(qi, oi, letter) {
    userAnswers[qi] = letter;
    document.querySelectorAll(`[id^="opt${qi}_"]`).forEach(btn => btn.classList.remove('selected'));
    document.getElementById(`opt${qi}_${oi}`).classList.add('selected');
    updateProgress();
  }

  function updateProgress() {
    const answered = userAnswers.filter(a => a !== null).length;
    document.getElementById('progressFill').style.width = `${(answered/questions.length)*100}%`;
  }

  function startTimer() {
    timeLeft = 600;
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      const m = Math.floor(timeLeft/60).toString().padStart(2,'0');
      const s = (timeLeft%60).toString().padStart(2,'0');
      document.getElementById('timerBox').textContent = `⏱ ${m}:${s}`;
      document.getElementById('timerBox').classList.toggle('warning', timeLeft <= 60);
      if (timeLeft <= 0) { clearInterval(timerInterval); submitQuiz(); }
    }, 1000);
  }

  function submitQuiz() {
    clearInterval(timerInterval);
    let correct = 0;
    questions.forEach((q, qi) => {
      const opts = document.querySelectorAll(`[id^="opt${qi}_"]`);
      opts.forEach(btn => btn.disabled = true);
      const correctIdx = ['A','B','C','D'].indexOf(q.answer);
      const userIdx = ['A','B','C','D'].indexOf(userAnswers[qi]);
      if (userAnswers[qi] === q.answer) { correct++; opts[correctIdx]?.classList.add('correct'); }
      else { opts[userIdx]?.classList.add('wrong'); opts[correctIdx]?.classList.add('correct'); }
    });
    showScore(correct);
  }

  function showScore(correct) {
    const total = questions.length;
    const pct = Math.round((correct/total)*100);
    document.getElementById('scoreSection').style.display = 'block';
    document.getElementById('scoreSection').scrollIntoView({ behavior: 'smooth' });
    document.getElementById('scoreNum').textContent = `${correct}/${total}`;
    document.getElementById('correctNum').textContent = correct;
    document.getElementById('wrongNum').textContent = total - correct;
    document.getElementById('pctNum').textContent = pct + '%';
    document.getElementById('scoreEmoji').textContent = pct >= 80 ? '🏆' : pct >= 60 ? '😊' : pct >= 40 ? '📚' : '💪';
    document.getElementById('scoreLabel').textContent = pct >= 80 ? 'Excellent! Amazing work!' : pct >= 60 ? 'Good job! Keep it up!' : pct >= 40 ? 'Not bad! Keep studying!' : 'Keep practicing, you got this!';

    document.getElementById('reviewDiv').innerHTML = questions.map((q, qi) => `
      <div class="question-card" style="margin-bottom:12px;">
        <div class="q-number" style="color:${userAnswers[qi]===q.answer?'#4ade80':'#f87171'}">${userAnswers[qi]===q.answer?'✅':'❌'} Question ${qi+1}</div>
        <div class="q-text">${q.question}</div>
        <div style="margin-top:10px; font-size:13px;">
          <span style="color:#4ade80; font-weight:600;">Correct: ${q.answer}</span>
          ${userAnswers[qi] && userAnswers[qi]!==q.answer ? `<span style="color:#f87171; font-weight:600; margin-left:12px;">Your answer: ${userAnswers[qi]}</span>` : ''}
        </div>
        <div style="margin-top:8px; font-size:13px; color:#9ca3af; background:rgba(255,255,255,0.03); padding:10px; border-radius:8px;">💡 ${q.explanation}</div>
      </div>
    `).join('');
  }

  function resetQuiz() {
    clearInterval(timerInterval);
    questions = []; userAnswers = [];
    document.getElementById('quizSection').style.display = 'none';
    document.getElementById('scoreSection').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function downloadPDF() {
    const correct = userAnswers.filter((a,i) => a === questions[i].answer).length;
    const total = questions.length;
    const pct = Math.round((correct/total)*100);
    let content = `QUIZMIND AI - QUIZ RESULTS\n${'='.repeat(40)}\nScore: ${correct}/${total} (${pct}%)\n\n`;
    questions.forEach((q, qi) => {
      content += `Q${qi+1}: ${q.question}\n`;
      q.options.forEach(opt => content += `  ${opt}\n`);
      content += `Answer: ${q.answer} | Your answer: ${userAnswers[qi]||'Not answered'}\n`;
      content += `Explanation: ${q.explanation}\n\n`;
    });
    const blob = new Blob([content], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href =
